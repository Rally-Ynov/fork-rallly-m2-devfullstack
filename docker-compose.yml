services:
  rallly_db:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5450:5432"
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rallly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rallly_selfhosted:
    image: ghcr.io/rally-ynov/fork-rallly-m2-devfullstack:main
    restart: always
    depends_on:
      rallly_db:
        condition: service_healthy
    ports:
      - 3000:3000
    environment:
      - DATABASE_URL=postgres://postgres:postgres@rallly_db/rallly
      - SECRET_PASSWORD=${SECRET_PASSWORD:?SECRET_PASSWORD manquant}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:?SUPPORT_EMAIL manquant}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL manquant}

volumes:
  db-data:
    driver: local
